<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="radar-base" content="">
<meta name="theme-color" content="#1c2027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Blackwater Radar</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { --panel:#1c2027; --panel2:#242a33; --line:#323a46; --text:#e6e8ec; --muted:#8b93a1; --accent:#2d6cdf; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:#0f1216; color:var(--text); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0 0 88px 0; background:#0f1216; }
  .leaflet-container { font:inherit; }
  .leaflet-control-attribution { background:rgba(20,23,28,.75)!important; color:#aab; font-size:10px; }
  .leaflet-control-attribution a { color:#9cf; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:#fff; color:#111; opacity:1; }
  .leaflet-popup-content { margin:10px 12px; }

  #panel { position:absolute; top:12px; left:12px; width:300px; max-height:calc(100% - 112px); overflow:auto; background:rgba(28,32,39,.94); border:1px solid var(--line); border-radius:12px; z-index:1000; backdrop-filter:blur(6px); }
  #panel h1 { font-size:15px; margin:0; padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #panel h1 > span { display:flex; flex-direction:column; line-height:1.2; }
  #regionSel { margin-left:auto; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit; font-size:12px; max-width:150px; }
  #panel h1 small { color:var(--muted); font-weight:400; font-size:11px; }
  .sec { padding:10px 14px; border-bottom:1px solid var(--line); }
  .sec:last-child { border-bottom:0; }
  .sec h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .baserow { display:flex; gap:6px; }
  .baserow .chip { flex:1; text-align:center; padding:4px 0; }
  .grph { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; margin-bottom:6px !important; }
  .grph .chev { width:7px; height:7px; border-right:1.5px solid var(--muted); border-bottom:1.5px solid var(--muted); transform:rotate(45deg); transition:transform .15s; margin:0 2px 3px 0; }
  .grp.closed .grph .chev { transform:rotate(-45deg); margin-bottom:0; }
  .grp.closed .body { display:none; }
  .grp.closed .grph { margin-bottom:0 !important; }
  .grph .n { margin-left:auto; font-size:10px; letter-spacing:0; text-transform:none; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:1px 7px; color:var(--text); min-width:22px; text-align:center; }
  .grph .n.on { background:var(--accent); border-color:var(--accent); }
  .grph .n:empty { display:none; }
  .opt { display:flex; align-items:center; gap:8px; padding:5px 0; cursor:pointer; white-space:nowrap; }
  .opt input { accent-color:var(--accent); margin:0; flex:none; }
  .opt select { margin-left:auto; max-width:148px; flex:none; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px 6px; font:inherit; font-size:12px; }
  .opt select[hidden] { display:none; }
  .sub { padding:4px 0 4px 24px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .sub input[type=range] { width:100%; accent-color:var(--accent); }
  .sub .muted { font-size:12px; color:var(--muted); }
  .radios { flex-direction:column; align-items:flex-start; gap:0; }
  .radios label { display:flex; align-items:center; gap:10px; padding:3px 0; cursor:pointer; }
  .radios input { appearance:none; -webkit-appearance:none; margin:0; flex:none; width:15px; height:15px; border:1.5px solid var(--muted); border-radius:50%; background:transparent; cursor:pointer; }
  .radios input:checked { border-color:var(--accent); background:radial-gradient(circle, var(--accent) 0 3.5px, transparent 4px); }
  .radios input:focus-visible { outline:2px solid #5b7fd0; outline-offset:2px; }
  .opt { position:relative; }
  .help { flex:none; width:16px; height:16px; padding:0; border:1.5px solid var(--muted); border-radius:50%; background:transparent; color:var(--muted); font:700 10px/1 system-ui,sans-serif; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  .help:hover, .help:focus-visible, .help[aria-expanded=true] { border-color:var(--accent); color:var(--text); outline:none; }
  .helptip { display:none; position:absolute; left:0; right:0; top:100%; z-index:5; white-space:normal; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.4; color:var(--text); box-shadow:0 4px 14px rgba(0,0,0,.45); cursor:default; }
  .help:hover + .helptip, .helptip:hover, .help[aria-expanded=true] + .helptip { display:block; }
  .subwrap { display:none; padding-bottom:6px; }
  .subwrap.open { display:block; }
  .chip { display:inline-block; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font:inherit; font-size:12px; cursor:pointer; line-height:1.4; }
  .chip.on { background:var(--accent); border-color:var(--accent); }
  .chip:hover { border-color:#5b7fd0; }
  .legend { display:flex; gap:2px; margin-top:6px; width:100%; }
  .legend div { flex:1; height:10px; position:relative; }
  .legend div span { position:absolute; top:12px; left:0; font-size:10px; color:var(--muted); }
  .note { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.35; }
  #toggle { position:absolute; top:12px; left:12px; z-index:1001; display:none; }
  .stlabel { background:rgba(255,255,255,.92); border:1px solid #999; color:#111; font-weight:600; font-size:11px; padding:1px 4px; border-radius:3px; box-shadow:none; }
  .stlabel::before { display:none; }
  .stlab { position:absolute; left:0; bottom:16px; transform:translateX(-50%); white-space:nowrap; opacity:.95; pointer-events:none; user-select:none; }
  .bslabel { background:rgba(255,255,255,.85); border:0; color:#111; font-weight:700; font-size:11px; padding:0 3px; border-radius:3px; box-shadow:none; }
  .bslabel::before { display:none; }
  .radios label.off { opacity:.4; pointer-events:none; }
  .opt[hidden], .subwrap[hidden] { display:none !important; }
  .fzlabel { background:#1b2a6b; color:#fff; border-color:#fff; font-size:12px; padding:1px 5px; transform:translate(-50%,-50%); white-space:nowrap; }

  #bar { position:absolute; left:0; right:0; bottom:0; height:88px; background:var(--panel); border-top:1px solid var(--line); padding:10px 14px; z-index:1000; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #bar button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  #bar button.primary { background:var(--accent); border-color:var(--accent); min-width:74px; }
  #slider { flex:1; min-width:160px; accent-color:var(--accent); }
  #label { font-weight:600; font-variant-numeric:tabular-nums; min-width:200px; }
  #bar select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  .muted { color:var(--muted); }
  kbd { background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:11px; }
  #status { font-size:12px; color:var(--muted); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; }
  #status b { color:#e0b04b; font-weight:600; }
  .pt table { border-collapse:collapse; font-variant-numeric:tabular-nums; }
  .pt td { padding:1px 8px 1px 0; }
  .pt td:last-child { text-align:right; font-weight:600; }

  #grab { display:none; }
  body.nobar #panel { max-height:calc(100% - 24px); }
  @media (max-width: 720px) {
    #panel { display:none; top:auto; bottom:126px; left:8px; right:8px; width:auto; max-height:none; height:55vh; overflow:hidden; flex-direction:column; }
    body.nobar #panel { bottom:8px; }
    #panel.open { display:flex; }
    #panel h1 { flex:none; }
    #panel .sec { flex:none; }
    #panel > .sec:last-of-type { padding-bottom:20px; }
    #panelBody { flex:1; overflow:auto; }
    #grab { display:flex; justify-content:center; padding:10px 0 4px; cursor:ns-resize; touch-action:none; flex:none; }
    #grab span { width:44px; height:5px; border-radius:3px; background:#5b6572; }
    #toggle { display:block; font-size:15px; font-weight:600; padding:9px 16px; border-radius:10px; background:rgba(28,32,39,.95); border:1px solid var(--line); box-shadow:0 2px 8px rgba(0,0,0,.45); }
    #label { min-width:0; font-size:13px; }
    #map { inset:0 0 118px 0; }
    #bar { height:118px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
    #bar button { padding:8px 12px; }
    #status span:last-child { display:none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<button id="toggle" class="chip">Layers</button>

<aside id="panel">
  <div id="grab" title="drag to resize"><span></span></div>
  <h1><span>Blackwater Radar <small id="updated"></small></span><select id="regionSel" title="Region"></select><button class="chip" id="closePanel" style="display:none">close</button></h1>

  <div class="sec" id="mydefault">
    <div style="display:flex;gap:6px;align-items:center"><button class="chip" id="saveDefault" style="flex:1;text-align:center" title="remember the current view, basemap, layers and settings">Make current map &amp; settings my default</button><button class="chip" id="clearDefault" style="flex:0 0 auto;display:none" title="go back to the standard opening view">forget</button></div>
    <div class="muted" id="defaultInfo" style="margin-top:4px"></div>
  </div>

  <div class="sec">
    <h2>Basemap</h2>
    <div class="baserow">
      <label class="chip on"><input type="radio" name="base" value="topo" checked hidden>Topo</label>
      <label class="chip"><input type="radio" name="base" value="sat" hidden>Satellite</label>
      <label class="chip"><input type="radio" name="base" value="terrain" hidden>Terrain</label>
      <label class="chip"><input type="radio" name="base" value="streets" hidden>Streets</label>
    </div>
  </div>

  <div class="sec grp" data-grp="now">
    <h2 class="grph"><span class="chev"></span>Now &amp; forecast <span class="n"></span></h2>
    <div class="body">
    <label class="opt"><input type="checkbox" id="lyRadar" checked> Radar loop
      <button type="button" class="help" aria-label="How to use the radar loop" aria-expanded="false">?</button>
      <span class="helptip" role="tooltip">Loop the last 3, 6, 12 or 24 hours of radar (set it in the bar at the bottom) to see where storms tracked. Then turn on Rain / snow totals, just below, to see how much fell along those tracks, Weather stations to check what individual gauges measured, and SNOTEL for the mountain snow sites.</span></label>
    <div class="subwrap" data-for="lyRadar">
      <div class="sub"><span class="muted">opacity</span><input type="range" id="radarOpacity" min="0.2" max="1" step="0.05" value="0.6"></div>
    </div>

    <label class="opt"><input type="checkbox" id="lyStations"> Weather stations</label>
    <div class="subwrap" data-for="lyStations">
      <div class="sub radios" id="stModes">
        <label><input type="radio" name="stMode" value="precip" checked> Precipitation</label>
        <label><input type="radio" name="stMode" value="snow"> New snow</label>
        <label><input type="radio" name="stMode" value="temp"> Temperature</label>
        <label><input type="radio" name="stMode" value="wind"> Wind</label>
      </div>
      <div class="sub" id="stWins"></div>
      <div class="sub" id="stInfo" style="display:block"></div>
    </div>

    <label class="opt"><input type="checkbox" id="lyAccum"> Rain / snow totals
      <button type="button" class="help" aria-label="About rain and snow totals" aria-expanded="false">?</button>
      <span class="helptip" role="tooltip">How much rain or new snow fell, as a map. Pick the time window below and the source in the dropdown: NOAA radar+gauges is radar corrected by rain gauges (US only); station interpolation spreads gauge totals across the terrain with elevation in mind and fades where gauges are sparse; radar estimate is radar alone and reads low in mountain valleys. The map is smoothed, so turn on Weather stations (gauges) or SNOTEL (mountain snow sites) to see what each one actually measured.</span>
      <select id="accumSrc" hidden>
        <option value="stations">Rain: station interpolation</option>
        <option value="mrms">Rain: NOAA radar+gauges</option>
        <option value="snow">New snow: station interpolation</option>
        <option value="radar">Rain: radar estimate</option>
      </select></label>
    <div class="subwrap" data-for="lyAccum">
      <div class="sub" id="accumWins"></div>
      <div class="sub" id="accumInfo" style="display:block"></div>
    </div>

    <label class="opt" id="snOpt"><input type="checkbox" id="lySnotel"> SNOTEL
      <button type="button" class="help" aria-label="About the SNOTEL layer" aria-expanded="false">?</button>
      <span class="helptip" role="tooltip">NRCS SNOTEL mountain snow sites, as on the NRCS interactive map. Show the stations, the HUC6 basins or both. Basins exist only for snow water and water-year precipitation (percent of the 1991–2020 median); snow depth, new snow and soil are station readings. New snow is the storm total: the biggest rise in snow depth inside the window, so settling afterwards doesn't erase it.</span></label>
    <div class="subwrap" data-for="lySnotel">
      <div class="sub" id="snModes">
        <button type="button" class="chip on" data-mode="stations">Stations</button>
        <button type="button" class="chip" data-mode="basins">Basins</button>
        <button type="button" class="chip" data-mode="both">Stations &amp; basins</button>
      </div>
      <div class="sub radios" id="snEls">
        <label><input type="radio" name="snEl" value="swe" checked> Snow water equivalent</label>
        <label data-st-only><input type="radio" name="snEl" value="depth"> Snow depth</label>
        <label data-st-only><input type="radio" name="snEl" value="new"> New snow</label>
        <label><input type="radio" name="snEl" value="prec"> Precipitation (water year)</label>
        <label data-st-only><input type="radio" name="snEl" value="sms"> Soil moisture</label>
        <label data-st-only><input type="radio" name="snEl" value="sto"> Soil temperature</label>
      </div>
      <div class="sub" id="snWins"></div>
      <div class="sub" id="snInfo" style="display:block"></div>
    </div>

    <label class="opt"><input type="checkbox" id="lyCams"> Webcams</label>
    <div class="subwrap" data-for="lyCams">
      <div class="sub" id="camInfo" style="display:block"></div>
    </div>

    <label class="opt"><input type="checkbox" id="lyFcst"> NOAA forecast
      <select id="fcSel" hidden>
        <option value="qpf_24">Rain 24 h</option><option value="qpf_48">Rain 48 h</option>
        <option value="snow_24">Snow 24 h</option><option value="snow_48">Snow 48 h</option>
        <option value="gust_24">Peak gust 24 h</option><option value="maxt">High temp</option><option value="mint">Low temp</option>
      </select></label>
    <div class="subwrap" data-for="lyFcst">
      <div class="sub" id="fcInfo" style="display:block"></div>
    </div>
    <label class="opt"><input type="checkbox" id="lyAvy"> <span id="avyTitle">Avalanche forecast</span></label>
    <div class="subwrap" data-for="lyAvy">
      <div class="sub" id="avyInfo" style="display:block"></div>
    </div>

    <label class="opt"><input type="checkbox" id="lyFz"> Freezing level (HRRR)</label>
    <div class="subwrap" data-for="lyFz">
      <div class="sub" id="fzHours"></div>
      <div class="sub"><label class="opt" style="padding:0"><input type="checkbox" id="fzBands"> shaded bands</label></div>
      <div class="sub" id="fzInfo" style="display:block"></div>
    </div>

    <label class="opt"><input type="checkbox" id="lySat"> Satellite loop (GOES)</label>
    <div class="subwrap" data-for="lySat">
      <div class="sub"><span class="muted">opacity</span><input type="range" id="satOpacity" min="0.2" max="1" step="0.05" value="0.85"></div>
      <div class="sub" id="satInfo" style="display:block"></div>
    </div>
    </div>
  </div>

  <div class="sec grp" data-grp="snow">
    <h2 class="grph"><span class="chev"></span>Snow <span class="n"></span></h2>
    <div class="body">
    <label class="opt"><input type="checkbox" id="lySnodas"> Modeled snow (SNODAS)
      <select id="snodasSel" hidden><option value="depth">Snow depth</option><option value="swe">Snow water equivalent</option></select></label>
    <div class="subwrap" data-for="lySnodas">
      <div class="sub" id="snodasInfo" style="display:block"></div>
    </div>

    </div>
  </div>

  <div class="sec grp" data-grp="water">
    <h2 class="grph"><span class="chev"></span>Water <span class="n"></span></h2>
    <div class="body">
    <label class="opt"><input type="checkbox" id="lyRivers"> Rivers
      <select id="rvModeSel" hidden><option value="pctmed">% of normal</option><option value="chg24">24 h change</option></select></label>
    <div class="subwrap" data-for="lyRivers">
      <div class="sub" id="rvInfo" style="display:block"></div>
    </div>
    <label class="opt"><input type="checkbox" id="lyStf"> Snow-to-flow sites (USBR)</label>
    <div class="subwrap" data-for="lyStf">
      <div class="sub" id="stfInfo" style="display:block"></div>
    </div>
    </div>
  </div>

  <div class="sec grp" data-grp="air">
    <h2 class="grph"><span class="chev"></span>Air quality <span class="n"></span></h2>
    <div class="body">
    <label class="opt"><input type="checkbox" id="lyAqSt"> AQI stations
      <button type="button" class="help" aria-label="About the AQI stations" aria-expanded="false">?</button>
      <span class="helptip" role="tooltip">Air quality monitors run by state, local, tribal and Canadian agencies, from AirNow. The number is the NowCast AQI for fine particles (PM2.5), the pollutant in wildfire smoke. NowCast weights the latest hours, so it responds within a few hours when smoke arrives; the official daily AQI is a 24 h average and lags. Squares are temporary monitors set up near fires. Data are preliminary and not verified.</span></label>
    <div class="subwrap" data-for="lyAqSt">
      <div class="sub" id="aqStInfo" style="display:block"></div>
    </div>

    <label class="opt"><input type="checkbox" id="lyAqGrid"> Interpolated AQI (monitors only)</label>
    <div class="subwrap" data-for="lyAqGrid">
      <div class="sub" id="aqGridInfo" style="display:block"></div>
    </div>
    </div>
  </div>

  <div class="sec grp" data-grp="hazards">
    <h2 class="grph"><span class="chev"></span>Hazards <span class="n"></span></h2>
    <div class="body">
    <label class="opt"><input type="checkbox" id="lyAlerts"> NWS watches &amp; warnings</label>
    </div>
  </div>

  <div class="sec note" id="legal"><a href="terms.html" target="_blank" rel="noopener" style="color:var(--muted)">Terms &amp; privacy</a> · some webcam images come through the YouTube API Services</div>
</aside>

<div id="bar">
  <div class="row">
    <button id="first" title="First (Home)">|&lt;</button>
    <button id="prev" title="Previous (←)">&lt;</button>
    <button id="play" class="primary" title="Play / pause (space)">Play</button>
    <button id="next" title="Next (→)">&gt;</button>
    <button id="last" title="Latest (End)">&gt;|</button>
    <input type="range" id="slider" min="0" max="0" value="0">
    <span id="label"></span>
    <select id="speed" title="Playback speed">
      <option value="700">slow</option>
      <option value="350" selected>normal</option>
      <option value="150">fast</option>
    </select>
    <select id="span" title="How much history to loop">
      <option value="3">last 3 h</option>
      <option value="6">last 6 h</option>
      <option value="12">last 12 h</option>
      <option value="24" selected>last 24 h</option>
      <option value="0">everything</option>
    </select>
  </div>
  <div id="status"><span id="count"></span><span id="latest"></span><span>Keys: <kbd>space</kbd> play <kbd>←</kbd><kbd>→</kbd> step <kbd>End</kbd> latest · click the map for totals at a point</span></div>
</div>

<script src="vendor/leaflet.js"></script>
<script>
  // pick the region before anything loads: ?r= in the link, then last used, then the default
  (function () {
    var R = window.REGIONS || {};
    var q = new URLSearchParams(location.search).get('r');
    var saved = null; try { saved = localStorage.getItem('radar.region'); } catch (e) {}
    var key = (q && R[q]) ? q : (saved && R[saved]) ? saved : (R.pnw ? 'pnw' : Object.keys(R)[0]);
    window.REGION = key || '';
    var b = (document.querySelector('meta[name="radar-base"]') || {}).content || '';
    window.REGION_BASE = b ? b + (key ? key + '/' : '') : (key ? 'regions/' + key + '/' : '');
    try { if (key) localStorage.setItem('radar.region', key); } catch (e) {}
    document.write('<script src="' + window.REGION_BASE + 'frames.js?t=' + Date.now() + '"><\/script>');
  })();
</script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const BASE = window.REGION_BASE || '';
  const REG = (window.REGIONS || {})[window.REGION] || { name: 'Pacific Northwest', home: [47.6, -120.7, 7] };
  const LVN = [REG.home[0], REG.home[1]];
  const RAIN_BINS = [[0.01, '#b9f0b9'], [0.10, '#50c850'], [0.25, '#fff000'], [0.50, '#ffaa00'], [0.75, '#ff5a00'], [1.00, '#dc0000'], [1.50, '#c800c8'], [2.00, '#7800b4'], [3.00, '#46006e']];
  const SNOW_BINS = [[0.1, '#7fbfe8'], [1, '#3f96d6'], [3, '#1f6fbf'], [6, '#0b4a99'], [12, '#5b2fa3'], [24, '#3a1370']];
  function fmt(v) { return v == null ? '–' : (Math.abs(v) < 0.005 ? '0' : (v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/^(-?)0\./, '$1.')); }
  function legendHtml(bins, f) { return '<div class="legend">' + bins.map(([lo, c]) => '<div style="background:' + c + '"><span>' + (f || fmt)(lo) + '</span></div>').join('') + '</div>'; }

  // ---------- map & basemaps ----------

    sat:     L.layerGroup([
               L.tileLayer(esri('World_Imagery'), { maxZoom: 17, attribution: esriAttr }),

  document.querySelectorAll('input[name=base]').forEach(r => r.addEventListener('change', () => {

  // ---------- grouped sections: fold/unfold, remember, count active layers ----------

        g.classList.toggle('closed');

      const n = g.querySelectorAll('.body > .opt > input:checked').length, b = g.querySelector('.n');

  // ---------- region picker: switching reloads with ?r= so every layer reads the right folder ----------
  (function () {
    const sel = $('regionSel');
    Object.entries(window.REGIONS || {}).forEach(([k, r]) => { const o = document.createElement('option'); o.value = k; o.textContent = r.name; if (k === window.REGION) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => { const u = new URL(location.href); u.searchParams.set('r', sel.value); location.href = u.toString(); };
    // first visit with no saved choice: offer the region the phone is in
    let saved = null; try { saved = localStorage.getItem('radar.region.chosen'); } catch (e) {}
    if (!saved && !new URLSearchParams(location.search).get('r') && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(p => {
        const here = Object.entries(window.REGIONS || {}).find(([k, r]) => p.coords.latitude >= r.bounds[0][0] && p.coords.latitude <= r.bounds[1][0] && p.coords.longitude >= r.bounds[0][1] && p.coords.longitude <= r.bounds[1][1]);
        try { localStorage.setItem('radar.region.chosen', '1'); } catch (e) {}
        if (here && here[0] !== window.REGION) { const u = new URL(location.href); u.searchParams.set('r', here[0]); location.href = u.toString(); }
      }, () => { try { localStorage.setItem('radar.region.chosen', '1'); } catch (e) {} }, { timeout: 5000, maximumAge: 600000 });
    }
  })();

  // ---------- panel behaviour: sub-controls and dropdowns only while a layer is on ----------
  document.querySelectorAll('.subwrap').forEach(w => {
    const cb = $(w.dataset.for);
    const sel = cb.parentElement.querySelector('select');

    cb.addEventListener('change', sync); sync();
  });
  document.querySelectorAll('.opt select').forEach(s => s.addEventListener('click', e => e.stopPropagation()));
  // (?) next to a layer: hover shows the tip, a click or tap pins it open until the next click elsewhere
  document.querySelectorAll('.help').forEach(b => b.addEventListener('click', e => {

    document.querySelectorAll('.help').forEach(x => x.setAttribute('aria-expanded', 'false'));
    b.setAttribute('aria-expanded', String(open));
  }));
  document.querySelectorAll('.helptip').forEach(t => t.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); }));
  document.addEventListener('click', () => document.querySelectorAll('.help').forEach(x => x.setAttribute('aria-expanded', 'false')));

  // ---------- data ----------
  let data = window.RADAR_DATA || { bounds: [[43, -127], [52.5, -112]], radar: [], sat: [], accum: [], legend: [] };
  const bounds = () => L.latLngBounds(data.bounds[0], data.bounds[1]);

  // ---------- radar loop (+ satellite following it) ----------
  const radar = L.imageOverlay('', bounds(), { opacity: +$('radarOpacity').value, interactive: false, zIndex: 400 });
  const satOv = L.imageOverlay('', bounds(), { opacity: +$('satOpacity').value, interactive: false, zIndex: 380 });
  let frames = [], i = 0, timer = null;
  const cache = {};
  function preload(f) { if (f && !cache[f.file]) { const im = new Image(); im.src = BASE + f.file; cache[f.file] = im; } }
  function selectFrames() {
    const hours = +$('span').value, all = data.radar || [];
    if (!all.length) return [];
    const end = all[all.length - 1].t;
    return hours ? all.filter(f => f.t > end - hours * 3600) : all.slice();
  }
  function nearestSat(t) {
    const s = data.sat || []; if (!s.length) return null;
    let best = s[0]; for (const f of s) if (Math.abs(f.t - t) < Math.abs(best.t - t)) best = f;

  function loadFrames(keepIndexFromEnd) {

    i = Math.max(0, frames.length - 1 - fromEnd);
    frames.forEach(preload);
    $('count').textContent = frames.length ? frames.length + ' scans in loop' : 'no scans yet';
    const rl = data.radar || [], last = rl[rl.length - 1];
    $('latest').innerHTML = last ? 'latest scan <b>' + last.label + '</b>' : '';
    $('updated').textContent = data.updated ? 'updated ' + data.updated : '';
    const sats = data.sat || [], sl = sats[sats.length - 1];

  }
  function show(n) {

  function toggle() { timer ? pause() : play(); }
  $('play').onclick = toggle;
  $('prev').onclick = () => { pause(); show(i - 1); };
  $('next').onclick = () => { pause(); show(i + 1); };
  $('first').onclick = () => { pause(); show(0); };
  $('last').onclick = () => { pause(); show(frames.length - 1); };
  $('slider').oninput = () => { pause(); show(+$('slider').value); };
  $('span').onchange = () => { pause(); loadFrames(false); show(frames.length - 1); };
  $('radarOpacity').oninput = e => radar.setOpacity(+e.target.value);
  $('satOpacity').oninput = e => satOv.setOpacity(+e.target.value);
  // the timeline bar only exists while a loop is on
  function syncBar() {
    const on = $('lyRadar').checked || $('lySat').checked;
    $('bar').style.display = on ? '' : 'none';
    $('map').style.bottom = on ? '' : '0';

    if (!on) pause();
    setTimeout(() => map.invalidateSize(), 50);
  }
  $('lyRadar').onchange = e => { if (e.target.checked) { radar.addTo(map); show(frames.length - 1); } else map.removeLayer(radar); syncBar(); };
  $('lySat').onchange = e => { if (e.target.checked) { satOv.addTo(map); (data.sat || []).forEach(preload); show(i); } else map.removeLayer(satOv); syncBar(); };
  document.addEventListener('keydown', e => {
    if (['SELECT', 'INPUT'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowLeft') { pause(); show(i - 1); }
    else if (e.key === 'ArrowRight') { pause(); show(i + 1); }
    else if (e.key === 'Home') { pause(); show(0); }
    else if (e.key === 'End') { pause(); show(frames.length - 1); }
  });

  // ---------- rain totals: MRMS (NOAA) or radar estimate ----------
  const accum = L.imageOverlay('', bounds(), { opacity: .7, interactive: false, zIndex: 390 });
  let accumKey = '24h', mrms = null;
  function accumList() {
    const src = $('accumSrc').value;
    if (src === 'mrms' && mrms) return Object.values(mrms.windows).map(w => ({ key: w.hours + 'h', file: w.file, start: '', end: 'valid ' + new Date(w.valid_utc + 'Z').toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) }));
    if ((src === 'stations' || src === 'snow') && stData && stData.interp) {
      const set = stData.interp[src === 'snow' ? 'snow' : 'precip'] || {};
      return Object.entries(set).map(([w, e]) => ({ key: w + 'h', file: e.file, start: '', end: e.n + ' stations, updated ' + (stData.updated || '') })).sort((a, b) => parseInt(a.key) - parseInt(b.key));
    }
    if (src === 'radar') return data.accum || [];
    return [];
  }
  function renderAccumUI() {
    const wins = $('accumWins'); wins.innerHTML = '';
    const list = accumList();
    if (!list.some(a => a.key === accumKey)) accumKey = list.length ? list[list.length - 1].key : null;
    list.forEach(a => {
      const b = document.createElement('button'); b.className = 'chip' + (a.key === accumKey ? ' on' : ''); b.textContent = a.key === 'all' ? 'all' : a.key;
      b.onclick = () => { accumKey = a.key; renderAccumUI(); showAccum(); }; wins.appendChild(b);
    });
    const a = list.find(x => x.key === accumKey);
    const srcKey = $('accumSrc').value;
    const src = { mrms: 'NOAA MRMS: radar corrected by gauges, 1 km, US only', stations: 'gauges only, elevation-aware interpolation; fades where sparse', snow: 'new snow (storm total) at SNOTEL and snow-depth gauges, elevation-aware; fades where sparse', radar: 'radar only; reads low in mountain valleys' }[srcKey];
    $('accumInfo').innerHTML = (a ? '<div class="muted">' + (a.start ? a.start + ' – ' : '') + a.end + '</div>' : '<div class="muted">not available' + (srcKey === 'snow' ? ' (no snow reports in this window)' : '') + '</div>') + legendHtml(srcKey === 'snow' ? SNOW_BINS : RAIN_BINS) + '<div class="note" style="margin-top:18px">inches · ' + src + '</div>';
  }
  function showAccum() { const a = accumList().find(x => x.key === accumKey); if (a) { accum.setUrl(BASE + a.file); if (!map.hasLayer(accum) && $('lyAccum').checked) accum.addTo(map); } else if (map.hasLayer(accum)) map.removeLayer(accum); }
  function loadMrms(then) { loadScript('data/mrms.js', () => { mrms = window.MRMS || mrms; if (then) then(); }, then); }
  function ensureStations(then) { if (stData) then(); else loadScript('data/stations.js', () => { stData = window.STATIONS || stData; then(); }, then); }
  function accumRefresh() {
    const v = $('accumSrc').value;
    const go = () => { renderAccumUI(); showAccum(); };
    if (v === 'stations' || v === 'snow') ensureStations(go);
    else if (v === 'mrms' && !mrms) loadMrms(go);
    else go();
  }
  $('lyAccum').onchange = e => { if (e.target.checked) accumRefresh(); else map.removeLayer(accum); };
  $('accumSrc').onchange = accumRefresh;
  setInterval(() => { if (map.hasLayer(accum)) loadMrms(() => { renderAccumUI(); showAccum(); }); }, 15 * 60 * 1000);

  // ---------- weather stations ----------
  const stLayer = L.layerGroup();
  let stData = null, stMode = 'precip', stWin = '24';
  function binColor(v, bins) { let c = '#9aa4b1'; for (const [lo, col] of bins) if (v >= lo) c = col; return c; }
  function stationLink(s) {
    if (s.src === 'HADS') return 'https://water.noaa.gov/gauges/' + s.id;
    if (s.src === 'CoCoRaHS') return 'https://www.cocorahs.org/ViewData/StationPrecipSummary.aspx?station=' + s.id;
    if (s.src === 'NWS') return 'https://www.weather.gov/wrh/timeseries?site=' + s.id;    // covers mesonet sites too; obhistory pages only exist for airports
    return null;
  }
  const TEMP_BINS = [[-20, '#313695'], [0, '#4575b4'], [10, '#74add1'], [20, '#abd9e9'], [32, '#e0f3f8'], [40, '#ffffbf'], [50, '#fee090'], [60, '#fdae61'], [70, '#f46d43'], [80, '#d73027'], [90, '#a50026'], [100, '#6e001e']];
  const WIND_BINS = [[0, '#c7e9c0'], [10, '#fff7bc'], [20, '#fec44f'], [30, '#fe9929'], [40, '#ec7014'], [50, '#cc4c02'], [65, '#8c2d04']];
  function tempSpark(arr) {
    const v = (arr || []).filter(x => x != null); if (v.length < 3) return '';
    const lo = Math.min(...v), hi = Math.max(...v), w = 220, h = 44;
    const pts = v.map((x, i) => [(i / (v.length - 1)) * (w - 4) + 2, h - 4 - ((x - lo) / ((hi - lo) || 1)) * (h - 10)]);
    return '<svg width="' + w + '" height="' + h + '" style="display:block;margin:6px 0"><polyline fill="none" stroke="#f46d43" stroke-width="2" points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/></svg><div style="font-size:11px;color:#666">last 24 h: ' + lo + '° to ' + hi + '°</div>';
  }
  const windIcon = (dir, color) => L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -10],
    html: '<div style="width:22px;height:22px;transform:rotate(' + ((dir || 0) + 180) + 'deg)"><svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="6" fill="' + color + '" stroke="#111" stroke-width="1"/><path d="M11 0 L16 8 L11 6 L6 8 Z" fill="#111"/></svg></div>' });
  function stationCard(s) {
    const wins = stData.windows || [];
    let rows = '';
    for (const [key, label] of [['precip', 'Precip'], ['snow', 'New snow'], ['swe', 'Snow water']]) {
      if (Object.keys(s[key] || {}).length) rows += '<tr><td style="padding:1px 6px;color:#666">' + label + '</td>' + wins.map(w => '<td style="padding:1px 6px;text-align:right">' + fmt(s[key][w]) + '</td>').join('') + '</tr>';
    }
    let html = '<div style="font:13px system-ui;min-width:220px"><b>' + s.name + '</b> <span style="color:#666">' + s.src + (s.elev ? ' · ' + Math.round(s.elev) + ' ft' : '') + '</span>';
    if (rows) html += '<table style="border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0 2px"><tr><th></th>' + wins.map(w => '<th style="padding:1px 6px;font-weight:600">' + w + 'h</th>').join('') + '</tr>' + rows + '</table><div style="font-size:11px;color:#666">inches</div>';
    else html += '<div style="margin:4px 0"></div>';
    if (s.temp) html += '<div>Temperature: <b>' + s.temp.now + '°F</b>' + (s.temp.max != null ? ' <span style="color:#666">(24 h ' + s.temp.min + '° to ' + s.temp.max + '°)</span>' : '') + '</div>' + tempSpark(s.temp.spark);
    if (s.wind) html += '<div>Wind: <b>' + (s.wind.spd != null ? s.wind.spd + ' mph' : '–') + '</b>' + (s.wind.gust != null ? ', gusting ' + s.wind.gust : '') + (s.wind.dir != null ? ', from ' + Math.round(s.wind.dir) + '°' : '') + (s.wind.max_gust != null ? ' <span style="color:#666">(24 h max gust ' + s.wind.max_gust + ')</span>' : '') + '</div>';
    if (s.rh != null) html += '<div>Humidity: ' + s.rh + '%</div>';
    if (s.depth != null) html += '<div>Snow depth: <b>' + fmt(s.depth) + ' in</b></div>';
    const link = stationLink(s);
    html += '<div style="color:#666;margin-top:4px">' + (s.last ? 'last report ' + s.last : '') + (link ? (s.last ? ' · ' : '') + '<a href="' + link + '" target="_blank" rel="noopener">station page</a>' : '') + '</div></div>';
    return html;
  }
  // Values show as labels from zoom 9, only on stations in view, drawn as plain markers: permanent
  // tooltips on all 1,047 PNW precip stations froze every zoom for 1.4-4 s (measured 2026-09-27),
  // since Leaflet measures each tooltip as it opens. Pans and zooms relabel.
  const stLabelLayer = L.layerGroup();
  let stLabels = [];      // [latlng, label, label marker while shown] for each station with a value
  function labelStations() {
    const show = map.hasLayer(stLayer) && map.getZoom() >= 9, b = map.getBounds().pad(.1);
    for (const l of stLabels) {
      const on = show && b.contains(l[0]);
      if (on && !l[2]) stLabelLayer.addLayer(l[2] = L.marker(l[0], { interactive: false, keyboard: false, pane: 'tooltipPane', icon: L.divIcon({ className: '', html: '<div class="stlabel stlab">' + l[1] + '</div>', iconSize: null }) }));
      else if (!on && l[2]) { stLabelLayer.removeLayer(l[2]); l[2] = null; }
    }
  }
  map.on('moveend', labelStations);      // fires after zooms too
  function renderStations() {
    stLayer.clearLayers(); stLabelLayer.clearLayers();
    stLayer.addLayer(stLabelLayer);
    stLabels = [];
    if (!stData) return;
    const tempMode = stMode === 'temp', windMode = stMode === 'wind';
    const list = stData.stations.filter(s => s.src !== 'SNOTEL');      // SNOTEL has its own layer
    const bins = tempMode ? TEMP_BINS : windMode ? WIND_BINS : (stMode === 'snow' ? SNOW_BINS : RAIN_BINS);
    let n = 0;

      let v;
      if (tempMode) v = s.temp ? s.temp.now : null;
      else if (windMode) v = s.wind ? (s.wind.gust != null ? s.wind.gust : s.wind.spd) : null;
      else v = ((s[stMode] || {})[stWin]);
      let m;
      if (v == null) {
        // station has no value for this metric: still on the map, just a quiet hollow dot
        m = L.circleMarker([s.lat, s.lon], { radius: 3, color: '#6b7280', weight: 1, fillColor: '#0b1220', fillOpacity: .35 });
        m.bindTooltip(s.name, { direction: 'top', offset: [0, -6], opacity: .95 });
      } else {
        n++;
        const mag = Math.max(0, v);
        if (windMode && s.wind.dir != null) m = L.marker([s.lat, s.lon], { icon: windIcon(s.wind.dir, binColor(mag, WIND_BINS)) });
        else {

    }
    labelStations();
    const winsEl = $('stWins'); winsEl.innerHTML = '';
    if (!tempMode && !windMode) (stData.windows || []).forEach(w => {
      const b = document.createElement('button'); b.className = 'chip' + (String(w) === stWin ? ' on' : ''); b.textContent = w + 'h';
      b.onclick = () => { stWin = String(w); renderStations(); }; winsEl.appendChild(b);
    });
    const legFmt = (tempMode || windMode) ? (x => String(x)) : fmt;
    const note = tempMode ? '°F now' : windMode ? 'mph, gust if reported; arrows point downwind' : stMode === 'snow' ? 'inches · CoCoRaHS observers’ 24 h snowfall and storm totals from snow-depth gauges; mountain snow sites are in the SNOTEL layer' : 'inches';
    $('stInfo').innerHTML = '<div class="muted">' + n + ' of ' + list.length + ' stations report this · hollow dots have other data · updated ' + (stData.updated || '') + '</div>' + legendHtml(bins, legFmt) + '<div class="note" style="margin-top:18px">' + note + '</div>';
    if ($('lyAccum').checked && ['stations', 'snow'].includes($('accumSrc').value)) { renderAccumUI(); showAccum(); }
  }
  function loadStations() { loadScript('data/stations.js', () => { stData = window.STATIONS || stData; renderStations(); }, () => { $('stInfo').innerHTML = '<div class="muted">station data not available yet</div>'; }); }
  function setStMode(v) { const r = document.querySelector('input[name=stMode][value="' + v + '"]'); if (!r) return; r.checked = true; stMode = v; renderStations(); }

  setInterval(() => { if (map.hasLayer(stLayer)) loadStations(); }, 15 * 60 * 1000);

  // ---------- SNODAS modeled snow ----------
  const snodasOv = L.imageOverlay('', bounds(), { opacity: .7, interactive: false, zIndex: 388 });

        (s.fc ? ' · <a href="https://www.nwrfc.noaa.gov/river/station/flowplot/flowplot.cgi?lid=' + s.fc.lid + '" target="_blank" rel="noopener">NWRFC forecast plot</a> · <a href="https://water.noaa.gov/gauges/' + s.fc.lid + '" target="_blank" rel="noopener">NWS gauge page</a>' : '') + '</div></div>';

      else m.bindTooltip(s.name.replace(/, (WA|OR|ID|MT)$/, '') + (s.flow != null ? ': ' + s.flow.toLocaleString() + ' cfs' : ''), { direction: 'top', offset: [0, -r] });

      : legendHtml([['falling', '#b45309'], ['steady', '#6b7280'], ['+10%', '#38bdf8'], ['+50%', '#2563eb'], ['+150%', '#7c3aed'], ['+300%', '#dc2626']], x => x);
    $('rvInfo').innerHTML = '<div class="muted">' + n + ' gauges · updated ' + (rvData.updated || '') + '</div>' + leg + '<div class="note" style="margin-top:18px">cfs; click a gauge for the trace and NWS forecast</div>';
  }
  function loadRivers() { loadScript('data/rivers.js', () => { rvData = window.RIVERS || rvData; renderRivers(); }, () => { $('rvInfo').innerHTML = '<div class="muted">river data not available yet</div>'; }); }
  $('rvModeSel').onchange = e => { rvMode = e.target.value; renderRivers(); };
  $('lyRivers').onchange = e => { if (e.target.checked) { rvLayer.addTo(map); if (!rvData) loadRivers(); else renderRivers(); } else map.removeLayer(rvLayer); };
  setInterval(() => { if (map.hasLayer(rvLayer)) loadRivers(); }, 15 * 60 * 1000);
  map.on('zoomend', () => { if (map.hasLayer(rvLayer)) renderRivers(); });

  // ---------- webcams ----------
  const camLayer = L.featureGroup(), wedgeLayer = L.layerGroup();
  let camData = null, camPopupOpen = false;
  camLayer.on('popupopen', () => { camPopupOpen = true; });
  camLayer.on('popupclose', () => { camPopupOpen = false; });
  const roadIcon = L.divIcon({ className: '', html: '<div style="width:18px;height:18px;border-radius:4px;background:#f59e0b;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>', iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -10] });
  const fireIcon = pan => L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12],
    html: '<div style="width:26px;height:26px;transform:rotate(' + (pan || 0) + 'deg)"><svg viewBox="0 0 26 26" width="26" height="26"><circle cx="13" cy="13" r="7" fill="#0ea5e9" stroke="#fff" stroke-width="2"/><path d="M13 1 L19 10 L13 8 L7 10 Z" fill="#fff" stroke="#0369a1" stroke-width="1"/></svg></div>' });
  function wedge(c, km) {
    const pts = [[c.lat, c.lon]], half = (c.fov || 45) / 2, R = 6371;
    for (let a = -half; a <= half; a += 3) {
      const br = ((c.pan || 0) + a) * Math.PI / 180, lat1 = c.lat * Math.PI / 180, lon1 = c.lon * Math.PI / 180, dr = km / R;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dr) + Math.cos(lat1) * Math.sin(dr) * Math.cos(br));
      const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(dr) * Math.cos(lat1), Math.cos(dr) - Math.sin(lat1) * Math.sin(lat2));
      pts.push([lat2 * 180 / Math.PI, lon2 * 180 / Math.PI]);
    }
    return L.polygon(pts, { color: '#0ea5e9', weight: 1, fillOpacity: .18, interactive: false });
  }
  // conditions cameras (ski areas, water, rivers, towns, parks): label, colour, glyph
  const CAM_KIND = { ski: ['ski area', '#5d7fa3', '❄︎'], water: ['water', '#3f8a86', '≈'], river: ['river', '#4f74a8', '~'],
                     town: ['town', '#8b6f9c', '⌂'], park: ['park or volcano', '#6b8a57', '▲'] };
  const condDot = (col, g, px) => '<span style="display:inline-block;width:' + px + 'px;height:' + px + 'px;border-radius:50%;background:' + col + ';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);color:#fff;font:bold ' + (px - 8) + 'px/' + (px - 4) + 'px system-ui;text-align:center;vertical-align:middle;box-sizing:border-box">' + g + '</span>';
  const condIcon = {};
  for (const [k, [, col, g]] of Object.entries(CAM_KIND)) condIcon[k] = L.divIcon({ className: '', iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -10], html: condDot(col, g, 20) });
  const camIcon = c => c.kind === 'fire' ? fireIcon(c.pan) : c.kind === 'road' ? roadIcon : (condIcon[c.kind] || roadIcon);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const camAge = ts => { if (!ts) return ''; const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60)); return ' · image ' + (m < 90 ? m + ' min' : m < 2880 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' days') + ' old at last refresh'; };
  const camSrc = v => v.img + (v.img.includes('?') ? '&' : '?') + 't=' + Date.now();
  // BEGIN ytInfo
  // YouTube cameras (webcams.js `yt`, from the YouTube Data API): the video link and the line under the
  // thumbnail. A live thumbnail carries no time, so say when the job last saw the stream live and when it started.
  function ytWatch(id) { return 'https://www.youtube.com/watch?v=' + encodeURIComponent(id); }
  function ytStatus(v, checkedT, nowS) {
    const ago = s => { const m = Math.max(0, Math.round((nowS - s) / 60)); return m < 90 ? m + ' min' : m < 2880 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' days'; };
    const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    let t = 'Live-stream thumbnail' + (checkedT ? ', live at the last check ' + ago(checkedT) + ' ago' : ', live now');
    if (v.since) { const d = new Date(v.since * 1000); t += ', streaming since ' + M[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
    return t + '. YouTube updates these thumbnails every few minutes, sometimes hours late.';
  }
  // END ytInfo
  // the YouTube icon, linked to the video, which the branding guidelines ask for when sources are mixed; drawn to the
  // official icon's shape and colours (not the downloaded file from brand.youtube: compare before relying on it)
  const YT_ICON = '<svg viewBox="0 0 176 124" width="28" height="20" role="img" aria-label="YouTube" style="display:block"><path fill="#FF0000" d="M172.3 19.4c-2-7.6-8-13.6-15.6-15.7C143 0 88 0 88 0S33 0 19.3 3.7C11.7 5.8 5.7 11.8 3.7 19.4 0 33.2 0 62 0 62s0 28.8 3.7 42.6c2 7.6 8 13.6 15.6 15.7C33 124 88 124 88 124s55 0 68.7-3.7c7.6-2.1 13.6-8.1 15.6-15.7C176 90.8 176 62 176 62s0-28.8-3.7-42.6z"/><path fill="#FFFFFF" d="M70 88.6 116 62 70 35.4z"/></svg>';
  const ytCredit = (c, v) => {
    const w = esc(ytWatch(v.yt)), a = ' target="_blank" rel="noopener"';
    return '<div style="display:flex;align-items:center;gap:8px"><a href="' + w + '"' + a + ' title="Watch on YouTube" style="flex:none;padding:2px 0">' + YT_ICON + '</a>' +
      '<span><a href="' + w + '"' + a + '>YouTube</a> · <a href="' + esc(c.link || w) + '"' + a + '>' + esc(c.owner || 'owner') + '</a></span></div>' +
      '<div style="margin-top:3px">' + esc(ytStatus(v, camData && camData.updated_t, Date.now() / 1000)) + '</div>' +
      '<div style="margin-top:3px;font-size:11px;color:#777">Image and live status from YouTube; the camera name, place and owner link are this map\'s, not YouTube\'s. ' +
      '<a href="https://www.youtube.com/t/terms"' + a + '>YouTube Terms of Service</a> · <a href="https://www.google.com/policies/privacy"' + a + '>Google Privacy Policy</a> · <a href="terms.html"' + a + '>this site\'s terms</a></div>';
  };
  function camPopup(c) {
    const views = c.views || [{ name: c.name, img: c.img, ts: c.ts, yt: c.yt, since: c.since }], v = views[0], src = camSrc(v);
    const kind = c.kind === 'road' ? 'road camera' : c.kind === 'fire' ? (c.src === 'FAA' ? 'FAA airport camera' : 'fire camera') + (c.pan != null ? ', facing ' + Math.round(c.pan) + '°' : '')
      : (CAM_KIND[c.kind] ? CAM_KIND[c.kind][0] + ' camera' : 'camera') + (c.stake ? ', snow stake' : '');
    const credit = v.yt ? '<div class="ytcredit">' + ytCredit(c, v) + '</div>'
      : /alertwest\.live/.test(c.link || '') ? esc(c.src) + ' via <a href="' + esc(c.link) + '" target="_blank" rel="noopener">AlertWest</a>'
      : '<a href="' + esc(c.link || '#') + '" target="_blank" rel="noopener">' + esc(c.owner || c.src || 'source') + '</a>' + (c.src && c.owner && !c.owner.includes(c.src) ? ' · ' + esc(c.src) : '');
    const btns = views.length < 2 ? '' : '<div class="camviews" style="margin:5px 0 0;display:flex;flex-wrap:wrap;gap:4px">' + views.map((w, i) =>
      '<button type="button" data-i="' + i + '" title="' + esc(w.name) + '" style="font:12px system-ui;padding:2px 8px;border-radius:5px;border:1px solid #bbb;cursor:pointer;background:' + (i ? '#fff' : '#e5e7eb') + '">' + (i + 1) + '</button>').join('') + '</div>';
    return '<div style="font:13px system-ui;width:min(80vw,440px)"><b>' + esc(c.name) + '</b> <span style="color:#666">' + kind + (views.length > 1 ? ' · ' + views.length + ' views' : '') + '</span>' + btns +
      '<div style="margin:6px 0"><a class="camlink" href="' + esc(v.yt ? ytWatch(v.yt) : src) + '" target="_blank" rel="noopener"><img class="camimg" src="' + esc(src) + '" alt="' + esc(v.name) + '" style="width:100%;border-radius:6px;background:#eee"></a>' +
      (views.length > 1 ? '<div class="camcap" style="color:#444;font-size:12px;margin-top:2px">' + esc(v.name) + '</div>' : '') + '</div>' +
      '<div style="color:#666;font-size:12px">' + credit + '<span class="camage">' + camAge(v.ts) + '</span></div></div>';
  }
  function wireCamPopup(c, el) {  // view buttons on a grouped camera
    if (!c.views || !el) return;
    el.querySelectorAll('.camviews button').forEach(b => b.onclick = () => {
      const v = c.views[+b.dataset.i], src = camSrc(v), img = el.querySelector('.camimg');
      img.src = src; img.alt = v.name; el.querySelector('.camlink').href = v.yt ? ytWatch(v.yt) : src;

      el.querySelector('.camage').textContent = camAge(v.ts);
      const yc = el.querySelector('.ytcredit');

    });
  }
  function renderCams() {
    if (camPopupOpen) return;
    camLayer.clearLayers(); wedgeLayer.clearLayers();
    if (!camData) return;
    const z = map.getZoom(), b = map.getBounds().pad(0.3);
    let n = 0;
    for (const c of camData.cams.concat(camData.yt || [])) {   // yt: YouTube cameras (absent from older webcams.js)
      if (!b.contains([c.lat, c.lon])) continue;
      if (z < 9 && c.kind === 'road') continue;
      n++;
      const m = L.marker([c.lat, c.lon], { icon: camIcon(c) });
      m.bindTooltip(esc(c.name) + (c.kind === 'fire' && c.pan != null ? ' · facing ' + Math.round(c.pan) + '°' : '') + (c.views ? ' · ' + c.views.length + ' views' : '') + (c.yt ? ' · YouTube live' : ''), { direction: 'top', offset: [0, -12] });

  }
  map.on('moveend', () => { if (map.hasLayer(camLayer)) renderCams(); });
  function loadCams() { loadScript('data/webcams.js', () => { camData = window.WEBCAMS || camData; renderCams(); }, () => { $('camInfo').innerHTML = '<div class="muted">camera list not available yet</div>'; }); }
  $('lyCams').onchange = e => { if (e.target.checked) { camLayer.addTo(map); wedgeLayer.addTo(map); if (!camData) loadCams(); else renderCams(); } else { map.removeLayer(camLayer); map.removeLayer(wedgeLayer); } };

  // ---------- avalanche forecast (every center in the window, via avalanche.org) ----------

    onEachFeature: (f, l) => {

      l.bindPopup('<div style="font:13px system-ui;max-width:320px"><b>' + p.name + '</b><div style="margin:4px 0"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:' + (p.color || '#888') + ';vertical-align:middle"></span> ' +
        (p.danger || 'no rating') + (p.warning ? ' · <b style="color:#dc2626">' + p.warning + '</b>' : '') + '</div>' +
        (p.travel_advice ? '<div style="font-size:12px;margin:4px 0">' + p.travel_advice + '</div>' : '') +
        (p.start_date ? '<div style="color:#666;font-size:12px">valid ' + p.start_date.slice(0, 10) + ' to ' + (p.end_date || '').slice(0, 10) + '</div>' : '') +
        (p.link ? '<div style="margin-top:6px"><a href="' + p.link + '" target="_blank" rel="noopener">' + (p.center ? p.center + ' forecast' : 'Full forecast') + ' →</a></div>' : '') + '</div>');

  // ---------- USBR snow-to-flow sites (seasonal SWE vs streamflow charts) ----------
  const stfLayer = L.featureGroup();

        '<div style="margin-top:6px"><a href="' + s.url + '" target="_blank" rel="noopener">Snow-to-flow chart (USBR) →</a> · <a href="https://waterdata.usgs.gov/monitoring-location/' + s.usgs + '/" target="_blank" rel="noopener">USGS ' + s.usgs + '</a></div></div>', { maxWidth: 300 });

  // ---------- freezing level (HRRR 0°C height) ----------
  const FZ_STOPS = [[0, [68, 1, 84]], [2000, [72, 40, 120]], [3000, [62, 74, 137]], [4000, [49, 104, 142]], [5000, [38, 130, 142]], [6000, [31, 158, 137]], [7000, [53, 183, 121]], [8000, [109, 205, 89]], [9000, [180, 222, 44]], [10000, [253, 231, 37]], [12000, [253, 174, 60]], [14000, [230, 80, 40]]];
  function fzColor(ft) {
    for (let k = 0; k < FZ_STOPS.length - 1; k++) {
      const [a, ca] = FZ_STOPS[k], [b, cb] = FZ_STOPS[k + 1];
      if (ft <= b) { const t = Math.max(0, (ft - a) / (b - a)); return 'rgb(' + ca.map((c, i) => Math.round(c + (cb[i] - c) * t)).join(',') + ')'; }
    }

  }

  function fzValidLabel(h) { return new Date(h.valid_utc + 'Z').toLocaleString([], { weekday: 'short', hour: 'numeric' }); }
  function renderFz() {

          }
        }
      }).addTo(fzLines);
    });
    $('fzInfo').innerHTML = '<div class="muted">' + fzValidLabel(h) + ' · HRRR run ' + new Date(fzData.run_utc + 'Z').toLocaleTimeString([], { hour: 'numeric' }) + ' · ' + h.min_ft.toLocaleString() + ' to ' + h.max_ft.toLocaleString() + ' ft in window</div>' +
      '<div class="legend">' + [2000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 12000].map(v => '<div style="background:' + fzColor(v) + '"><span>' + (v / 1000) + 'k</span></div>').join('') + '</div>' +
      '<div class="note" style="margin-top:18px">height of the 0 °C level, ft; lines every ' + (fzData.step_ft || 500) + ' ft, bold each 1,000, hover a line for its value. Snow level is typically 500 to 1,000 ft lower.</div>';
  }

    render('<div style="color:#666">loading stations…</div>');
    // nearest stations, gauge, avalanche zone
    await new Promise(res => stData ? res() : loadScript('data/stations.js', () => { stData = window.STATIONS || stData; res(); }, res));
    if (stData) {
      const near = [];
      const t = nearest(stData.stations, ll, s => s.temp); if (t) near.push('<div>' + t.s.name + ' <span style="color:#666">(' + t.km.toFixed(0) + ' km' + (t.s.elev ? ', ' + Math.round(t.s.elev).toLocaleString() + ' ft' : '') + ')</span>: <b>' + t.s.temp.now + '°F</b>' + (t.s.wind && t.s.wind.spd != null ? ', wind ' + t.s.wind.spd + (t.s.wind.gust ? 'g' + t.s.wind.gust : '') + ' mph' : '') + (t.s.rh != null ? ', RH ' + t.s.rh + '%' : '') + '</div>');
      const sn = nearest(stData.stations, ll, s => s.src === 'SNOTEL'); if (sn) near.push('<div>SNOTEL ' + sn.s.name + ' <span style="color:#666">(' + sn.km.toFixed(0) + ' km' + (sn.s.elev ? ', ' + Math.round(sn.s.elev).toLocaleString() + ' ft' : '') + ')</span>: ' + (sn.s.depth != null ? 'snow depth <b>' + fmt(sn.s.depth) + ' in</b>' : 'no snow') + (sn.s.snow && sn.s.snow['24'] != null ? ', new snow ' + fmt(sn.s.snow['24']) + ' in / 24 h' : '') + (sn.s.precip && sn.s.precip['24'] != null ? ', precip ' + fmt(sn.s.precip['24']) + ' in / 24 h' : '') + (sn.s.swe_pct != null ? ', snowpack ' + sn.s.swe_pct + '% of median' : '') + '</div>');
      if (near.length) sec.push('<div style="margin-top:6px;color:#666">Nearest stations</div>' + near.join(''));
    }
    await new Promise(res => rvData ? res() : loadScript('data/rivers.js', () => { rvData = window.RIVERS || rvData; res(); }, res));
    if (rvData) { const g = nearest(rvData.sites, ll, s => s.flow != null); if (g && g.km < 40) sec.push('<div style="margin-top:6px;color:#666">Nearest gauge</div><div>' + g.s.name.replace(/, (WA|OR|ID|MT)$/, '') + ' <span style="color:#666">(' + g.km.toFixed(0) + ' km)</span>: <b>' + g.s.flow.toLocaleString() + ' cfs</b>' + (g.s.pctmed != null ? ', ' + g.s.pctmed + '% of normal' : '') + (g.s.chg24 != null ? ', ' + (g.s.chg24 > 0 ? '+' : '') + g.s.chg24 + '% / 24 h' : '') + '</div>'); }
    await new Promise(res => window.AVALANCHE ? res() : loadScript('data/avalanche.js', res, res));
    if (window.AVALANCHE) { const z = window.AVALANCHE.features.find(f => f.geometry && pointInPoly([ll.lng, ll.lat], f.geometry)); if (z) sec.push('<div style="margin-top:6px;color:#666">Avalanche zone</div><div>' + z.properties.name + ': <b>' + (z.properties.danger || 'no rating') + '</b>' + (z.properties.link ? ' · <a href="' + z.properties.link + '" target="_blank" rel="noopener">' + (z.properties.center_id || 'forecast') + '</a>' : '') + '</div>'); }
    // air quality: nearest reporting station within 100 km (judgment call, spec ledger); AirNow's grid when that layer is on
    await new Promise(res => aqData ? res() : loadScript('data/airquality.js', () => { aqData = window.AIRQ || aqData; res(); }, res));
    if (aqData) {
      const nowS = Date.now() / 1000, rows = [];
      const a = nearest(aqData.stations, ll, s => !aqStale(s, aqData.hours, nowS));
      if (a && a.km <= 100) { const l = aqLast(a.s); rows.push('<div>' + aqEsc(a.s.name) + ' <span style="color:#666">(' + a.km.toFixed(0) + ' km' + (a.s.temp ? ', temporary' : '') + ')</span>: <b>AQI ' + l.aqi + '</b>, ' + AQ_NAMES[aqCat(l.aqi)] + '</div>'); }
      if ($('lyAqGrid').checked) { const v = sample(await getGrid('aqi'), ll); if (v != null) rows.push('<div>interpolated AQI <b>' + Math.round(v) + '</b>, ' + AQ_NAMES[aqCat(v)] + ' <span style="color:#666">(AirNow, monitors only)</span></div>'); }
      if (rows.length) sec.push('<div style="margin-top:6px;color:#666">Air quality</div>' + rows.join(''));
    }
    render('<div style="color:#666">loading hourly forecast…</div>');
    // NWS hourly point forecast (US only)
    try {
      const pt = await (await fetch('https://api.weather.gov/points/' + ll.lat.toFixed(4) + ',' + ll.lng.toFixed(4))).json();
      const url = pt.properties && pt.properties.forecastHourly;
      if (url) {
        const hf = await (await fetch(url)).json();
        const periods = (hf.properties || {}).periods || [];
        if (periods.length) {
          const now = periods[0];
          sec.push('<div style="margin-top:6px;color:#666">NWS hourly forecast</div><div>' + now.shortForecast + ', ' + now.temperature + '°F, wind ' + now.windSpeed + ' ' + now.windDirection + '</div>' + meteogram(periods) +
            '<div style="font-size:11px"><a href="https://forecast.weather.gov/MapClick.php?lat=' + ll.lat.toFixed(4) + '&lon=' + ll.lng.toFixed(4) + '" target="_blank" rel="noopener">full NWS point forecast</a></div>');
        }
      }
    } catch (err) { /* outside NWS coverage or offline */ }
    sec.push('<div style="color:#666;font-size:11px;margin-top:6px">station windows follow the Weather stations selection (' + w + ' h)</div>');
    render('');
  });

  // ---------- refresh ----------
  function applyData() { [radar, satOv, accum, fcst, fzBands, snodasOv, aqOv].forEach(l => l.setBounds(bounds())); if ($('lyAccum').checked) { renderAccumUI(); showAccum(); } loadFrames(true); }
  function refresh() {
    loadScript('frames.js', () => { const wasPlaying = !!timer; pause(); data = window.RADAR_DATA || data; applyData(); if (wasPlaying) play(); });
  }
  setInterval(refresh, 5 * 60 * 1000);

  // ---------- mobile panel: bottom sheet with a drag bar ----------
  const panel = $('panel');
  // wrap the sections so the header and grab bar stay put while the body scrolls
  const body = document.createElement('div'); body.id = 'panelBody';
  Array.from(panel.querySelectorAll(':scope > .sec')).forEach(s => body.appendChild(s));
  document.querySelectorAll('.baserow .chip').forEach(c => c.classList.toggle('on', c.querySelector('input').checked));
  panel.appendChild(body);
  function setPanel(open) { panel.classList.toggle('open', open); $('toggle').style.visibility = open ? 'hidden' : 'visible'; $('closePanel').style.display = open ? '' : 'none'; if (open) panel.style.height = ''; }
  $('toggle').onclick = () => setPanel(true);
  $('closePanel').onclick = () => setPanel(false);
  (function () {
    const grab = $('grab'); let startY = 0, startH = 0, dragging = false;
    grab.addEventListener('pointerdown', e => { dragging = true; startY = e.clientY; startH = panel.getBoundingClientRect().height; grab.setPointerCapture(e.pointerId); e.preventDefault(); });
    grab.addEventListener('pointermove', e => {
      if (!dragging) return;
      const h = Math.max(60, Math.min(window.innerHeight * 0.85, startH - (e.clientY - startY)));
      panel.style.height = h + 'px';
    });
    const end = () => { if (!dragging) return; dragging = false; if (panel.getBoundingClientRect().height < 110) setPanel(false); };
    grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
  })();

  // ---------- go ----------
  radar.addTo(map);
  applyData();          // opens on the latest scan; press Play to run the loop from the oldest
  // ---------- "make this my default": remember the current view and every control on this device ----------
  // BEGIN migrateDefault (tests/test_map_defaults.py runs this block under node)
  function migrateDefault(d) {
    // saves from before 2026-09-27 had "Snowpack by basin" (lyBasins, basinSel) and SNOTEL modes in Weather stations
    if (!d) return d;
    d.checks = d.checks || {}; d.selects = d.selects || {};
    const sm = d.stMode || d.selects.stModeSel;
    if (!('lySnotel' in d.checks)) {
      if (d.checks.lyBasins) { d.checks.lySnotel = true; d.snMode = 'basins'; d.snEl = d.selects.basinSel === 'prec' ? 'prec' : 'swe'; }
      else if (d.checks.lyStations && (sm === 'swe_pct' || sm === 'wy_pct')) { d.checks.lySnotel = true; d.checks.lyStations = false; d.snMode = 'stations'; d.snEl = sm === 'wy_pct' ? 'prec' : 'swe'; }
    }
    if (sm) d.stMode = { swe_pct: 'precip', wy_pct: 'precip', swe: 'snow' }[sm] || sm;
    delete d.checks.lyBasins; delete d.selects.basinSel; delete d.selects.stModeSel;
    return d;
  }
  // END migrateDefault
  const DEF_KEY = 'radar.default';
  const DEF_CHECKS = ['lyRadar', 'lySat', 'lyStations', 'lyCams', 'lyFz', 'fzBands', 'lyFcst', 'lyAvy', 'lyAccum', 'lySnodas', 'lySnotel', 'lyRivers', 'lyStf', 'lyAqSt', 'lyAqGrid', 'lyAlerts'];
  const DEF_SELECTS = ['accumSrc', 'snodasSel', 'rvModeSel', 'fcSel', 'speed', 'span'];
  const DEF_RANGES = ['radarOpacity', 'satOpacity'];
  function readDefault() { try { return JSON.parse(localStorage.getItem(DEF_KEY) || 'null'); } catch (e) { return null; } }
  function defaultInfo() {
    const d = readDefault();
    $('clearDefault').style.display = d ? '' : 'none';
    $('defaultInfo').textContent = d ? 'Saved ' + d.when + ' · this map loads on every visit from this device' : 'Set the map up the way you like it, then save it here';
  }
  $('saveDefault').onclick = () => {
    const d = readDefault() || {};
    d.when = new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    d.base = (document.querySelector('input[name=base]:checked') || {}).value;
    d.checks = {}; DEF_CHECKS.forEach(id => { if ($(id)) d.checks[id] = $(id).checked; });
    d.selects = {}; DEF_SELECTS.forEach(id => { if ($(id)) d.selects[id] = $(id).value; });
    d.ranges = {}; DEF_RANGES.forEach(id => { if ($(id)) d.ranges[id] = $(id).value; });
    d.stWin = stWin; d.stMode = stMode;
    d.snMode = snMode; d.snEl = snEl; d.snWin = snWin; d.snDepth = snDepth;
    d.views = d.views || {}; d.views[window.REGION] = { c: [map.getCenter().lat, map.getCenter().lng], z: map.getZoom() };
    try { localStorage.setItem(DEF_KEY, JSON.stringify(d)); } catch (e) {}
    defaultInfo();
  };
  $('clearDefault').onclick = () => { try { localStorage.removeItem(DEF_KEY); } catch (e) {} defaultInfo(); };
  function applyDefault() {
    const d = migrateDefault(readDefault()); if (!d) return;
    if (d.base && bases[d.base]) { const r = document.querySelector('input[name=base][value="' + d.base + '"]'); if (r && !r.checked) { r.checked = true; r.dispatchEvent(new Event('change')); } }
    for (const id in d.ranges || {}) { const el = $(id); if (el) { el.value = d.ranges[id]; el.dispatchEvent(new Event('input')); } }
    for (const id in d.selects || {}) { const el = $(id); if (el && el.value !== d.selects[id]) { el.value = d.selects[id]; if (id === 'rvModeSel') el.dispatchEvent(new Event('change')); } }
    if (d.stWin) stWin = String(d.stWin);
    const sm = d.stMode || (d.selects || {}).stModeSel;     // older saves kept the mode in a dropdown
    if (sm && sm !== stMode) setStMode(sm);
    if (d.snMode) snMode = d.snMode;
    if (d.snEl) setSnEl(d.snEl);
    if (d.snWin) snWin = String(d.snWin);
    if (d.snDepth) snDepth = String(d.snDepth);
    DEF_CHECKS.forEach(id => { const el = $(id); if (el && el.closest('.opt') && el.closest('.opt').hidden) return; const want = !!(d.checks || {})[id]; if (el && el.checked !== want) { el.checked = want; el.dispatchEvent(new Event('change')); } });
    document.querySelectorAll('.grp').forEach(g => { if (g.querySelector('.body > .opt > input:checked')) g.classList.remove('closed'); });
    if (window.updateGroupCounts) window.updateGroupCounts();
    const v = (d.views || {})[window.REGION];
    if (v) map.setView(v.c, v.z);
  }
  defaultInfo();
  applyDefault();
})();
</script>
</body>
</html>
