name: tests

# Unit tests (tests/). No secrets, no network: everything the
# tests need is stdlib + pytest + PyYAML, so the heavy scientific stack in
# requirements.txt (eccodes, xarray, ...) is not installed here.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml numpy scipy pillow netCDF4 eccodes   # numpy: values.read_grid and the snow archive tests; scipy, pillow: smoke.py (test_smoke); netCDF4: currents.py (test_currents); eccodes: swell.py, nwps.py (GRIB2 fixtures)
      - run: python -m pytest tests/ -v
