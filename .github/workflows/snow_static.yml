name: snow static

# One-off builds of the snow model's static inputs (the terrain lattice), started by hand.
# Downloads 20 USGS DEM tiles (~1.1 GB), writes pnw/snow/static/lattice.npz and lattice.json to R2.
on:
  workflow_dispatch:
    inputs:
      region:
        description: region key (must have "snow": True in region.py)
        default: pnw

jobs:
  lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGION: ${{ inputs.region || 'pnw' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: radar
      R2_PUBLIC_URL: https://radar-files.blackwaterlabs.org
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy pyyaml boto3 shapely rasterio pyproj
      - run: python -m snow.lattice --upload
