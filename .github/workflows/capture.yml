name: radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# all region runs share this group so only one job writes to R2 at a time
concurrency:
  group: r2-writes
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Los_Angeles
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: radar
      R2_PUBLIC_URL: https://radar-files.blackwaterlabs.org
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pnw
        run: REGION=pnw python cloud.py radar
      - name: sierra
        if: always()
        run: REGION=sierra python cloud.py radar
      - name: utco
        if: always()
        run: REGION=utco python cloud.py radar
      - name: imw
        if: always()
        run: REGION=imw python cloud.py radar
