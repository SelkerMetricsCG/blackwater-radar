name: hourly

on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:

concurrency:
  group: r2-writes
  cancel-in-progress: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Los_Angeles
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: radar
      R2_PUBLIC_URL: https://radar-files.blackwaterlabs.org
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pnw
        run: REGION=pnw python cloud.py hourly
      - name: sierra
        if: always()
        run: REGION=sierra python cloud.py hourly
      - name: utco
        if: always()
        run: REGION=utco python cloud.py hourly
      - name: imw
        if: always()
        run: REGION=imw python cloud.py hourly
