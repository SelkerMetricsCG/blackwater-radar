name: hourly

on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:
    inputs:
      force:                        # radar-cron sends no inputs, so its runs keep the once-per-hour rule
        description: "Run even if this hour's layers already went up (otherwise a second run in the same UTC hour does nothing)"
        type: boolean
        default: false

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        region: [pnw, sierra, utco, imw, ne]
        include:                    # each region on the time zone most of its land is in; Pacific by default
          - region: utco
            tz: America/Denver
          - region: imw
            tz: America/Denver
          - region: ne
            tz: America/New_York
    # one hourly job per region at a time; radar runs are independent (they never touch the same files)
    concurrency:
      group: hourly-${{ matrix.region }}
      cancel-in-progress: false
    env:
      TZ: ${{ matrix.tz || 'America/Los_Angeles' }}
      REGION: ${{ matrix.region }}
      HOURLY_FORCE: ${{ inputs.force }}           # empty on scheduled runs
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}       # YouTube Data API (webcams); without it the job leaves YouTube cameras out
      R2_BUCKET: radar
      R2_PUBLIC_URL: https://radar-files.blackwaterlabs.org
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ${{ matrix.region }} hourly layers
        run: python cloud.py hourly
