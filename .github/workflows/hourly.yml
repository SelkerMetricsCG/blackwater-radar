name: hourly

on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        region: [pnw, sierra, utco, imw]
    # one hourly job per region at a time; radar runs are independent (they never touch the same files)
    concurrency:
      group: hourly-${{ matrix.region }}
      cancel-in-progress: false
    env:
      TZ: America/Los_Angeles
      REGION: ${{ matrix.region }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: radar
      R2_PUBLIC_URL: https://radar-files.blackwaterlabs.org
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ${{ matrix.region }} hourly layers
        run: python cloud.py hourly
