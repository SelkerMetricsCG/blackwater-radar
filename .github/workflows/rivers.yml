name: rivers

# Daily river analysis for rivers.blackwaterlabs.org: USGS flow + SNOTEL snowpack ->
# seasonal-volume forecasts, the last-boatable-day call and its spring track, figures.
# Runs at 15:30 UTC (07:30 PST / 08:30 PDT), after USGS has published yesterday's daily
# values, and uploads rivers/<key>/* to the public "radar" bucket. See rivers/run_rivers.py.
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

concurrency:
  group: rivers
  cancel-in-progress: false

jobs:
  rivers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Los_Angeles
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: radar
      R2_PUBLIC_URL: https://radar-files.blackwaterlabs.org
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rivers/requirements.txt
      - run: pip install -r rivers/requirements.txt
      - name: run every river and upload to R2
        run: python rivers/run_rivers.py
