# Snow-conditions model: every parameter the snow/ modules read, in the snotel_config.yaml format.
# Source categories (verification protocol): measured / fitted from data / literature / library default /
# judgment call. Library defaults and judgment calls need Chris's sign-off; record the date under `approved`.
approved: null          # nothing here is approved yet (2026-09-29): first-season placeholders

lattice:
  name: nwac
  # judgment call (2026-09-29): NWAC's forecast area, the Olympics to the Cascade east slope, Mt Hood to the
  # border. North edge 49.0 because the USGS 1 arc-second tiles stop at the border. Alternative not chosen:
  # the whole pnw map window (14 x 10 degrees, 20x the cells, mostly outside any forecast zone).
  bbox_lonlat: [-124.9, 45.2, -120.0, 49.0]      # west, south, east, north (degrees)
  crs: EPSG:26910          # NAD83 / UTM 10N (126-120 W): slope in true ground metres, see slope/slope_config.yaml
  cell_m: 100              # judgment call: the observations can support zone x band x aspect, not finer; 15 M cells
  dem_dataset: "USGS 3DEP 1 arc-second (about 30 m) seamless DEM, GeoTIFF tiles"
  dem_url: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/{tile}/USGS_1_{tile}.tif"
  # judgment call: 30 m data averaged onto 100 m cells (each cell the mean of ~11 source cells). The spec named
  # 1/3 arc-second; at 100 m the extra resolution changes nothing and the tiles are 9x bigger.
  resampling: average
  slope_algorithm: Horn    # convention (gdaldem's default); computed on the 100 m grid
  flat_below_deg: 2        # judgment call: aspect is undefined (-1) where slope is under this
  aspect_octants: [N, NE, E, SE, S, SW, W, NW]     # 45 deg bins centred on the cardinal directions
  # judgment call: NWAC's below / near / above treeline bands differ by zone and are not published as numbers.
  # These are the Stevens Pass zone's from its forecast page; they apply only where no treeline could be found.
  bands_ft: [4000, 6000]
  canopy_dataset: "ESA WorldCover 2021 v200, 10 m, class 10 (tree cover) averaged onto the cell"
  delete_downloads: true
  # judgment call (2026-09-29): the Cascade crest as a polyline (lat, lon), north to south, read off the map:
  # Slate Peak / Harts Pass, Washington Pass, Cascade Pass, Glacier Peak, Stevens, Snoqualmie, Chinook, White Pass,
  # Goat Rocks, Mt Adams, the Columbia, Mt Hood. crest_km per cell is the signed east-west distance from it
  # (negative west), used by the assimilation's similarity (a west-side and an east-side slope at the same
  # elevation and aspect are different snow; within crest_same_km of the crest they are treated as the same side).
  crest_latlon: [[48.99, -120.85], [48.72, -120.67], [48.52, -120.65], [48.47, -121.07], [48.11, -121.11],
                 [47.75, -121.09], [47.42, -121.42], [46.87, -121.52], [46.64, -121.39], [46.50, -121.45],
                 [46.20, -121.49], [45.70, -121.75], [45.37, -121.70]]
  treeline:
    # judgment call (2026-09-29): the treeline of a zone is the elevation above which its median canopy (smoothed
    # over 1.1 km) stays under 15%; the near-treeline band is the 600 m below it (NWAC's near band is about
    # 2000 ft wide). Alternative not chosen: NWAC's per-zone numbers (not published as data).
    treeline_canopy: 0.15
    near_width_m: 600
    smooth_cells: 11
    min_cells: 5000
    min_cells_per_bin: 200

solar:
  solar_constant_w_m2: 1361        # literature (Kopp & Lean 2011)
  # literature: Meinel & Meinel (1976) clear-sky direct-normal transmittance, with the altitude term of
  # Laue (1970): I = I0 * ((1 - 0.14 h_km) * 0.7^(AM^0.678) + 0.14 h_km). Air mass: Kasten & Young (1989).
  # Alternative not chosen: Ineichen-Perez (needs Linke turbidity by month).
  clear_sky_model: meinel_laue
  diffuse_fraction: 0.10           # judgment call: isotropic diffuse as a fraction of direct normal on a clear day
  # literature: Kasten & Czeplak (1980) global-irradiance cloud factor 1 - 0.75 * N^3.4 (N cloud fraction 0..1)
  cloud_a: 0.75
  cloud_b: 3.4
  step_min: 10                     # judgment call: integration step for daily totals
  terrain_albedo: 0.5              # judgment call: albedo of the surrounding terrain for the reflected term (1 - svf) x albedo x global (Dozier & Frew 1990); snow-covered slopes with trees

# Surface-state model (snow/state.py). Every value is a first-season placeholder (judgment call) until the
# residual ledger exists; bounds and max_step are what the fit may do to it later.
state:
  fresh_cm: {value: 10, bounds: [5, 25], max_step: 2, source: judgment call, note: "hn24 at or above this makes the surface 'fresh'"}
  dust_cm: {value: 2, bounds: [1, 5], max_step: 1, source: judgment call, note: "hn24 between this and fresh_cm on a crust is 'dust on crust'"}
  settle_days: {value: 2, bounds: [1, 5], max_step: 1, source: judgment call, note: "fresh becomes settled powder after this many days"}
  solar_crust_mj: {value: 12, bounds: [6, 30], max_step: 2, source: judgment call, note: "cumulative MJ/m2 on the cell since the last fresh snow that makes a sun crust (Jan 15 south 30 deg gets ~14 a day clear)"}
  wind_mph_dry: {value: 18, bounds: [10, 30], max_step: 2, source: literature, note: "NDFD 10 m wind (exposure-scaled) that transports dry snow: Li & Pomeroy 1997 mean threshold 7.7 m/s (17 mph) for dry loose snow, Guyomarc'h & Merindol 1998 down to 4 m/s for very fresh snow; ridgetop winds run higher, revisit with NWAC telemetry"}
  wind_mph_wet: {value: 22, bounds: [15, 35], max_step: 2, source: literature, note: "the same for a wet or melt-freeze surface (rain_wet, melt_freeze, isothermal): Li & Pomeroy 1997 9.9 m/s (22 mph) wet or icy; crusts (sun_crust, rain_crust) never transport"}
  wind_sector_deg: {value: 60, bounds: [30, 90], max_step: 10, source: judgment call, note: "a cell counts as lee (loading) or windward (scouring) when its aspect is within this many degrees of the downwind or upwind direction"}
  wind_hours: {value: 6, bounds: [3, 24], max_step: 2, source: judgment call, note: "hours above the surface's transport threshold (wind_mph_dry / wind_mph_wet) since the last fresh snow that make the surface wind-affected"}
  rain_line_margin_ft: {value: 1000, bounds: [500, 2000], max_step: 250, source: literature, note: "snow level sits about this far below the HRRR freezing level"}
  rain_mix_ft: {value: 500, bounds: [200, 1000], max_step: 100, source: judgment call, note: "half-width of the mixed band around the snow level"}
  rain_in: {value: 0.1, bounds: [0.05, 0.5], max_step: 0.05, source: judgment call, note: "24 h liquid falling as rain on the cell above this makes a rain crust"}
  slr_at_0c: {value: 8, bounds: [6, 12], max_step: 1, source: literature, note: "snow-to-liquid ratio near 0 C (Roebber et al. 2003 climatology, PNW low end)"}
  slr_per_c: {value: 1.0, bounds: [0.5, 2.0], max_step: 0.2, source: judgment call, note: "SLR rises this much per degree C of cooling below 0 C, capped at slr_max"}
  slr_max: {value: 20, bounds: [15, 30], max_step: 2, source: literature, note: "cap on the snow-to-liquid ratio"}
  refreeze_good: {value: 0.6, bounds: [0.3, 0.9], max_step: 0.1, source: judgment call, note: "refreeze_index at or above this counts as a solid overnight refreeze"}
  melt_tmax_c: {value: 2, bounds: [0, 6], max_step: 1, source: judgment call, note: "band daily max above this with solar melts the surface (corn cycle when it also refroze)"}
  isothermal_days: {value: 3, bounds: [2, 7], max_step: 1, source: judgment call, note: "days of melt without a solid refreeze before the surface is isothermal"}
  canopy_solar_tau: {value: 0.25, bounds: [0.05, 0.6], max_step: 0.05, source: literature, note: "fraction of the sun reaching the snow under a closed canopy (Link & Marks 1999 range 0.1-0.4); cell solar = solar * ((1 - canopy) + canopy * tau)"}
  canopy_refreeze_loss: {value: 0.4, bounds: [0.1, 0.8], max_step: 0.1, source: judgment call, note: "the canopy blocks the sky, so the refreeze index is reduced by this fraction under a closed canopy"}
  lapse_c_per_km: {value: 4.5, bounds: [3, 7], max_step: 0.5, source: literature, note: "temperature lapse from the band's SNOTEL sites to the cell's elevation when the station field is missing, and the free-air lapse the field falls back to above an inversion: Minder, Mote & Lundquist 2010 windward Cascades annual 3.9-5.2 C/km (Tmax 6.1, Tmin 4.2)"}
  crust_tmin_c: {value: -8, bounds: [-14, -2], max_step: 1, source: judgment call, note: "sun on a surface whose band max is at or below this makes no crust (sublimation, no melt)"}
  crust_tfull_c: {value: 0, bounds: [-4, 4], max_step: 1, source: judgment call, note: "band max at or above this: all the day's solar counts toward the crust"}
  rain_refreeze_tmin_c: {value: -1, bounds: [-4, 1], max_step: 0.5, source: judgment call, note: "a rain-soaked surface becomes a rain crust once the band min drops below this; until then it is rain_wet"}
  settled_days: {value: 7, bounds: [4, 10], max_step: 1, source: judgment call, note: "powder is 'settled' through this many days since the storm, 'settled_late' after, 'old' past 14"}
  canopy_lw_fraction: {value: 0.35, bounds: [0.1, 0.6], max_step: 0.05, source: judgment call, note: "of the sun a canopy absorbs, the fraction that reaches the snow as longwave off the warm trees (spring tree wells)"}
  albedo_fresh: {value: 0.85, bounds: [0.75, 0.9], max_step: 0.02, source: literature, note: "albedo of fresh snow"}
  albedo_min: {value: 0.6, bounds: [0.45, 0.7], max_step: 0.03, source: literature, note: "albedo of old, dirty or wet snow"}
  # literature: US Army Corps of Engineers (1956) snow albedo decay as used in VIC and FSM: albedo = albedo_fresh * A^(t^B),
  # t days since a resetting snowfall; cold (band max below 0 C) A 0.94, B 0.58; melting A 0.82, B 0.46. At 8 days 0.69 cold,
  # 0.51 melting (the linear 0.03/day it replaced gave 0.61 for both). Floored at albedo_min.
  albedo_cold_a: {value: 0.94, bounds: [0.85, 0.98], max_step: 0.01, source: literature, note: "USACE 1956 cold-snow decay base"}
  albedo_cold_b: {value: 0.58, bounds: [0.3, 0.8], max_step: 0.04, source: literature, note: "USACE 1956 cold-snow decay exponent"}
  albedo_melt_a: {value: 0.82, bounds: [0.7, 0.9], max_step: 0.01, source: literature, note: "USACE 1956 melting-snow decay base"}
  albedo_melt_b: {value: 0.46, bounds: [0.3, 0.7], max_step: 0.04, source: literature, note: "USACE 1956 melting-snow decay exponent"}
  albedo_ref: {value: 0.75, bounds: [0.7, 0.8], max_step: 0.02, source: convention, note: "the albedo at which solar_crust_mj means what it says; absorbed energy is scaled by (1 - albedo) / (1 - albedo_ref)"}
  wind_sx_per_deg: {value: 0.02, bounds: [0.005, 0.04], max_step: 0.005, source: judgment call, note: "wind speed multiplier is 1 - this x Winstral Sx (deg) toward the wind: +20 deg sheltered -> 0.6, -10 deg exposed -> 1.2"}
  wind_expo_min: {value: 0.3, bounds: [0.1, 0.6], max_step: 0.05, source: judgment call, note: "floor of the exposure multiplier"}
  wind_expo_max: {value: 1.6, bounds: [1.2, 2.5], max_step: 0.1, source: judgment call, note: "ceiling of the exposure multiplier (ridge crests)"}
  tfield_min_stations: {value: 20, bounds: [10, 60], max_step: 5, source: judgment call, note: "stations with a full day of readings needed before the station field replaces the band means"}
  tfield_min_per_zone: {value: 6, bounds: [4, 12], max_step: 1, source: judgment call, note: "stations in a zone (spanning 500 m of elevation) for its own lapse fit; else the pooled fit"}
  tfield_idw_km: {value: 40, bounds: [15, 80], max_step: 5, source: judgment call, note: "reach of the residual interpolation (inverse distance squared)"}
  tfield_vertical_k: {value: 15, bounds: [5, 30], max_step: 3, source: literature, note: "elevation-aware distance for the residual interpolation, d^2 = dh^2 + (k dz)^2: a 300 m elevation difference counts like 4.5 km, so a valley cold-pool residual does not climb the ridges (Frei 2014 non-Euclidean distance; Magnusson et al. 2014 3-D localisation)"}
  tfield_inversion_lapse: {value: -2.0, bounds: [-4, 0], max_step: 0.5, source: literature, note: "a night lapse (C/km, + = inversion) above this means the valley stations flattened the fit: refit on the stations above the inversion top and let the valley residuals carry the pool (Pages & Miro 2010; Frei 2014)"}
  tree_load_tmin_c: {value: -3, bounds: [-6, -1], max_step: 1, source: judgment call, note: "snow sticks to the canopy when the band mean temperature is between this"}
  tree_load_tmax_c: {value: 1.5, bounds: [0, 3], max_step: 0.5, source: judgment call, note: "and this (wet snow near 0 C loads trees; cold dry snow blows through)"}
  tree_load_full_cm: {value: 25, bounds: [10, 50], max_step: 5, source: judgment call, note: "sticky new snow that fills the canopy load (load = 1)"}
  tree_load_decay: {value: 0.15, bounds: [0.05, 0.4], max_step: 0.05, source: judgment call, note: "fraction of the canopy load shed quietly per day"}
  tree_release_load: {value: 0.5, bounds: [0.3, 0.9], max_step: 0.1, source: judgment call, note: "load at or above this can come down all at once"}
  tree_release_wind_h: {value: 3, bounds: [1, 12], max_step: 1, source: judgment call, note: "hours above wind_mph in a day that dump a loaded canopy"}
  tree_release_tmax_c: {value: 3, bounds: [1, 8], max_step: 1, source: judgment call, note: "band max above this dumps a loaded canopy"}
  tree_debris_canopy: {value: 0.5, bounds: [0.3, 0.8], max_step: 0.1, source: judgment call, note: "canopy fraction at or above which a release ruins the surface (tree_debris) for the day"}
  min_depth_in: {value: 4, bounds: [2, 12], max_step: 2, source: judgment call, note: "SNODAS depth below this is 'no snow'"}
  # assimilation (snow/assimilate.py): a report nudges the cells similar to its own within assim_radius_km
  assim_radius_km: {value: 12, bounds: [3, 30], max_step: 3, source: judgment call, note: "how far a report reaches"}
  assim_elev_m: {value: 150, bounds: [50, 400], max_step: 50, source: judgment call, note: "cells within this much elevation of the report's cell count as similar"}
  assim_aspect_deg: {value: 45, bounds: [22, 90], max_step: 10, source: judgment call, note: "cells within this many degrees of the report's aspect count as similar (flat only matches flat)"}
  crest_same_km: {value: 5, bounds: [2, 15], max_step: 2, source: judgment call, note: "within this distance of the crest both sides count as the same side"}
  assim_canopy: {value: 0.3, bounds: [0.1, 0.6], max_step: 0.1, source: judgment call, note: "canopy fraction difference within which cells count as similar"}
  assim_weight: {value: 0.8, bounds: [0.2, 1.0], max_step: 0.1, source: judgment call, note: "nudge weight at the report itself (times its confidence); decays with distance"}
  cloud_day_hours: {value: [8, 17], source: convention, note: "local hours whose NDFD sky cover feeds the solar term"}
  cloud_night_hours: {value: [21, 6], source: convention, note: "local hours whose sky, dewpoint and wind feed the refreeze term"}
