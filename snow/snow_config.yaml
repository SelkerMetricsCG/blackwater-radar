# Snow-conditions model: every parameter the snow/ modules read, in the snotel_config.yaml format.
# Source categories (verification protocol): measured / fitted from data / literature / library default /
# judgment call. Library defaults and judgment calls need Chris's sign-off; record the date under `approved`.
approved: null          # nothing here is approved yet (2026-09-29): first-season placeholders

lattice:
  name: nwac
  # judgment call (2026-09-29): NWAC's forecast area, the Olympics to the Cascade east slope, Mt Hood to the
  # border. North edge 49.0 because the USGS 1 arc-second tiles stop at the border. Alternative not chosen:
  # the whole pnw map window (14 x 10 degrees, 20x the cells, mostly outside any forecast zone).
  bbox_lonlat: [-124.9, 45.2, -120.0, 49.0]      # west, south, east, north (degrees)
  crs: EPSG:26910          # NAD83 / UTM 10N (126-120 W): slope in true ground metres, see slope/slope_config.yaml
  cell_m: 100              # judgment call: the observations can support zone x band x aspect, not finer; 15 M cells
  dem_dataset: "USGS 3DEP 1 arc-second (about 30 m) seamless DEM, GeoTIFF tiles"
  dem_url: "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/{tile}/USGS_1_{tile}.tif"
  # judgment call: 30 m data averaged onto 100 m cells (each cell the mean of ~11 source cells). The spec named
  # 1/3 arc-second; at 100 m the extra resolution changes nothing and the tiles are 9x bigger.
  resampling: average
  slope_algorithm: Horn    # convention (gdaldem's default); computed on the 100 m grid
  flat_below_deg: 2        # judgment call: aspect is undefined (-1) where slope is under this
  aspect_octants: [N, NE, E, SE, S, SW, W, NW]     # 45 deg bins centred on the cardinal directions
  # judgment call: NWAC's below / near / above treeline bands differ by zone and are not published as numbers.
  # These are the Stevens Pass zone's from its forecast page, used everywhere until per-zone values are entered.
  bands_ft: [4000, 6000]

solar:
  solar_constant_w_m2: 1361        # literature (Kopp & Lean 2011)
  # literature: Meinel & Meinel (1976) clear-sky direct-normal transmittance, with the altitude term of
  # Laue (1970): I = I0 * ((1 - 0.14 h_km) * 0.7^(AM^0.678) + 0.14 h_km). Air mass: Kasten & Young (1989).
  # Alternative not chosen: Ineichen-Perez (needs Linke turbidity by month).
  clear_sky_model: meinel_laue
  diffuse_fraction: 0.10           # judgment call: isotropic diffuse as a fraction of direct normal on a clear day
  # literature: Kasten & Czeplak (1980) global-irradiance cloud factor 1 - 0.75 * N^3.4 (N cloud fraction 0..1)
  cloud_a: 0.75
  cloud_b: 3.4
  step_min: 10                     # judgment call: integration step for daily totals
